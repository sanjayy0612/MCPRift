[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mcprift"
version = "0.4.0"
description = "A bounded MCP security-testing framework for controlled targets."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = ["httpx2>=2.5,<3", "mcp==2.0.0"]

[dependency-groups]
dev = ["ruff==0.13.3"]

[project.scripts]
mcprift = "mcprift.cli:main"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
