[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mcprift"
version = "0.1.0"
description = "A deliberately bounded MCP connectivity baseline for authorized testing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==2.0.0"]

[dependency-groups]
dev = ["ruff==0.13.3"]

[project.scripts]
mcprift = "mcprift.cli:main"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
